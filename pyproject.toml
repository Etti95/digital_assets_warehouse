[project]
name = "crypto-data-warehouse"
version = "0.1.0"
description = "Production-style crypto data warehouse portfolio project for on-chain analytics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dbt-core>=1.9,<2.0",
  "dbt-postgres>=1.9,<2.0",
  "httpx>=0.27,<0.28",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-dotenv>=1.0,<2.0",
  "tenacity>=9.0,<10.0",
]

[dependency-groups]
dev = [
  "apache-airflow==2.10.5",
  "pendulum>=3.0,<4.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.11,<0.12",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]

[tool.hatch.build.targets.sdist]
include = [
  "ingestion",
  "orchestration",
  "dbt",
  "sql",
  "tests",
  "docs",
  "dashboards",
  "README.md",
  "Makefile",
  "docker-compose.yml",
  ".env.example",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
