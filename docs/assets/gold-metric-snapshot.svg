<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Gold metric snapshot</title>
  <desc id="desc">Current metric counts for the demo warehouse.</desc>
  <rect width="1200" height="420" fill="#f6f7f3"/>
  <text x="60" y="70" fill="#16202a" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Gold Layer Snapshot</text>
  <text x="60" y="108" fill="#586270" font-family="Helvetica, Arial, sans-serif" font-size="18">Current materialized outputs from the validated local demo dataset.</text>

  <g transform="translate(60 150)">
    <rect width="250" height="190" rx="20" fill="#ffffff" stroke="#d9e0d6"/>
    <text x="24" y="50" fill="#4d5968" font-family="Helvetica, Arial, sans-serif" font-size="17">Daily Active Wallets</text>
    <text x="24" y="122" fill="#0f1720" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="700">1</text>
    <text x="24" y="156" fill="#7a8794" font-family="Helvetica, Arial, sans-serif" font-size="15">`gold_daily_active_wallets`</text>
  </g>

  <g transform="translate(340 150)">
    <rect width="250" height="190" rx="20" fill="#ffffff" stroke="#d9e0d6"/>
    <text x="24" y="50" fill="#4d5968" font-family="Helvetica, Arial, sans-serif" font-size="17">Transactions Per Day</text>
    <text x="24" y="122" fill="#0f1720" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="700">1</text>
    <text x="24" y="156" fill="#7a8794" font-family="Helvetica, Arial, sans-serif" font-size="15">`gold_transactions_per_day`</text>
  </g>

  <g transform="translate(620 150)">
    <rect width="250" height="190" rx="20" fill="#ffffff" stroke="#d9e0d6"/>
    <text x="24" y="50" fill="#4d5968" font-family="Helvetica, Arial, sans-serif" font-size="17">Gas Metrics Daily</text>
    <text x="24" y="122" fill="#0f1720" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="700">1</text>
    <text x="24" y="156" fill="#7a8794" font-family="Helvetica, Arial, sans-serif" font-size="15">`gold_gas_metrics_daily`</text>
  </g>

  <g transform="translate(900 150)">
    <rect width="240" height="190" rx="20" fill="#ffffff" stroke="#d9e0d6"/>
    <text x="24" y="50" fill="#4d5968" font-family="Helvetica, Arial, sans-serif" font-size="17">Token Price Daily</text>
    <text x="24" y="122" fill="#0f1720" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="700">62</text>
    <text x="24" y="156" fill="#7a8794" font-family="Helvetica, Arial, sans-serif" font-size="15">`gold_token_price_daily`</text>
  </g>
</svg>

